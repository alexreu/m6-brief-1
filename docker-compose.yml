version: "3.9"

services:
  # serveur Prefect: héberge l'UI et l'API sur le port 4200
  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    container_name: prefect-server
    ports:
      - "4200:4200"
    volumes:
      # persist de la base SQLite entre les redémarrages
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # exécute le pipeline flow.py toutes les 30 secondes
  drift-monitor:
    build: .
    container_name: drift-monitor
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped

volumes:
  prefect_data:
    name: prefect_data